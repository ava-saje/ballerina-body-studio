<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Ballerina Body Studio — Your ballerina era starts here</title>
<meta name="description" content="A free, personalised ballet-inspired workout generator. Create your own routine in seconds, no sign-up required." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <section id="view-landing" class="view">
    <div class="landing-inner">
      <p class="eyebrow">THE BALLERINA BODY STUDIO</p>
      <div class="ribbon-divider" aria-hidden="true"></div>
      <h1 class="headline">Your ballerina era<br>starts here.</h1>
      <p class="subhead">A little movement, made just for you.</p>
      <p class="supporting">Create your own personalised, ballet-inspired workout in seconds.</p>
      <button id="start-quiz-btn" class="btn-primary" type="button">Create my workout</button>
      <p class="free-note">Free · No sign-up · No app to download</p>
    </div>
  </section>

  <section id="view-quiz" class="view hidden">
    <div class="quiz-shell">
      <div class="quiz-top">
        <button id="quiz-back-btn" class="quiz-back" type="button" aria-label="Go back">&larr;</button>
        <div class="quiz-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="quiz-progress-bar" class="quiz-progress-bar"></div>
        </div>
      </div>
      <div id="quiz-question-container"></div>
    </div>
  </section>

  <section id="view-results" class="view hidden">
    <div id="results-container" class="results-shell"></div>
  </section>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
